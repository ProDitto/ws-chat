version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: quikchat-backend/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://user:password@db:5432/quikchat?sslmode=disable
      - REDIS_ADDRESS=redis:6379
      - JWT_SECRET_KEY=a-very-secret-key-that-is-long-and-secure
    volumes:
      - ../quikchat-backend:/app/quikchat-backend
      - ../quikchat-frontend:/app/quikchat-frontend

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=quikchat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d quikchat"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

